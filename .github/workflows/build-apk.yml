name: DSK VIDEO Android APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK Build Type (debug, release, or both)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dsk-video-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build DSK VIDEO APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository & Capacitor configuration
        run: |
          set -e
          if [ ! -f "package.json" ]; then
            echo "::error::Missing package.json at repository root."
            exit 1
          fi
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "::error::Missing capacitor.config.ts or capacitor.config.json at repository root."
            exit 1
          fi
          if [ -f "capacitor.config.ts" ] && ! grep -q 'com\.dskvideo\.ott' capacitor.config.ts; then
            echo "::error::Invalid package ID in capacitor.config.ts. Expected com.dskvideo.ott."
            exit 1
          fi
          if [ -f "app/build.gradle.kts" ] && ! grep -q 'applicationId = "com.dskvideo.ott"' app/build.gradle.kts; then
            echo "::error::Invalid package ID in app/build.gradle.kts. Expected com.dskvideo.ott."
            exit 1
          fi
          echo "Repository, Capacitor config, and package ID com.dskvideo.ott verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node.js & Capacitor dependencies
        run: |
          set -e
          if ! node -e "const p=require('./package.json'); if(!p.scripts||!p.scripts.build){process.exit(1)}"; then
            echo "::error::Missing build script in package.json."
            exit 1
          fi
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
          for pkg in "@capacitor/core" "@capacitor/cli" "@capacitor/android"; do
            if [ ! -d "node_modules/$pkg" ]; then
              echo "::error::Missing Capacitor dependency: $pkg"
              exit 1
            fi
          done

      - name: Build web bundle & detect web directory
        run: |
          set -e
          npm run build
          WEB_DIR=""
          for candidate in dist build out www; do
            if [ -d "$candidate" ]; then
              WEB_DIR="$candidate"
              break
            fi
          done
          if [ -z "$WEB_DIR" ]; then
            echo "::error::Web build directory not found (checked dist, build, out, www)."
            exit 1
          fi
          echo "Detected web build directory: $WEB_DIR"

      - name: Configure & sync Capacitor Android project
        run: |
          set -e
          if [ ! -d "android" ] && [ ! -d "app/src/main" ]; then
            npx cap add android
          fi
          if [ -d "android" ]; then
            npx cap sync android
            if [ -f "android/gradlew" ]; then
              chmod +x android/gradlew
            fi
          else
            echo "Native Android Gradle module detected at app/src/main; preserving existing Kotlin/Compose app."
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            platforms;android-35
            build-tools;35.0.0
            platforms;android-36
            build-tools;36.0.0

      - name: Accept Android SDK Licenses & Verify SDK Environment
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root directory not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager binary not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          mkdir -p "$SDK_ROOT/licenses"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          if [ -f "app/build.gradle.kts" ] && grep -q "minorApiLevel" app/build.gradle.kts; then
            if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1"; then
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=1 "platforms;android-36.1" || true
            fi
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;36.1.0" || true
          fi

          if [ ! -f "$SDK_ROOT/licenses/android-sdk-license" ]; then
            echo "::error::Android SDK license agreement file missing at $SDK_ROOT/licenses/android-sdk-license."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          java -version
          ls -la "$SDK_ROOT/licenses"
          ls -la "$SDK_ROOT/platforms"

      - name: Setup Gradle 9.3.1
        if: ${{ hashFiles('android/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment & debug keystore
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            sed -i "s|^# *SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}|" .env || true
            sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}|" .env || true
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -f "app/build.gradle.kts" ]; then
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: |
          set -e
          mkdir -p build-artifacts
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
          else
            gradle assembleDebug --no-daemon --stacktrace
            mkdir -p android/app/build/outputs/apk/debug
            ROOT_DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -z "$ROOT_DEBUG_APK" ]; then
              echo "::error::Gradle did not produce app/build/outputs/apk/debug/*.apk."
              exit 1
            fi
            cp "$ROOT_DEBUG_APK" android/app/build/outputs/apk/debug/app-debug.apk
          fi

          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            FOUND_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -z "$FOUND_APK" ]; then
              echo "::error::APK not generated at android/app/build/outputs/apk/debug/app-debug.apk."
              exit 1
            fi
            cp "$FOUND_APK" android/app/build/outputs/apk/debug/app-debug.apk
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check Release Signing Secrets
        id: signing_check
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.build_type }}" = "release" ]; then
              echo "::error::Missing release signing configuration (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
              exit 1
            else
              echo "::notice::Release signing secrets not configured. Proceeding with app-debug.apk."
            fi
          fi

      - name: Build Signed Release APK
        if: ${{ steps.signing_check.outputs.can_sign == 'true' && inputs.build_type != 'debug' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          set -e
          mkdir -p build-artifacts
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
            cd ..
            RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            gradle assembleRelease --no-daemon --stacktrace
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Gradle did not produce app-release.apk."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          cp "$RELEASE_APK" build-artifacts/app-release.apk
          rm -f "$KEYSTORE_PATH"
          echo "Generated signed build-artifacts/app-release.apk"

      - name: Clean sensitive temporary files
        if: always()
        run: |
          rm -f "${{ github.workspace }}/my-upload-key.jks"
          rm -f .env

      - name: Upload DSK-VIDEO-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSK-VIDEO-APK-build-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            build-artifacts/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write Build Summary
        if: always()
        run: |
          echo "### DSK VIDEO APK Builder - Build #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package ID:** \`com.dskvideo.ott\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`DSK-VIDEO-APK-build-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug APK Path:** \`android/app/build/outputs/apk/debug/app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -lh build-artifacts/ 2>/dev/null || true
